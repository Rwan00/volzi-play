name: volzi_play
description: "Volzi Play — an elegant iOS video player"
publish_to: "none"
version: 1.0.2+2

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  video_player: ^2.10.1
  wakelock_plus: ^1.3.3
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo.ttf
    - family: ElMessiri
      fonts:
        - asset: assets/fonts/ElMessiri.ttf
    - family: Cinzel
      fonts:
        - asset: assets/fonts/Cinzel.ttf
